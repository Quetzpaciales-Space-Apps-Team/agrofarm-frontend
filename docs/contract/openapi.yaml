openapi: 3.1.0
info:
  title: AgroFarm core-api
  version: 0.1.0
  description: >
    Public REST API for AgroFarm: authentication, farms, farm data uploads,
    priorities, insights, map layers, ENSO climate series, scenario simulation,
    crop rotation recommendations, and trigram search.
    Recommendations are decision support and never replace local agronomists or farmers.
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: health
    description: Liveness and readiness probes
  - name: auth
    description: Registration, login, token rotation, logout, and current user profile
  - name: farms
    description: Farm management, uploads, priorities, insights, and rotation recommendations
  - name: layers
    description: Geospatial and satellite map layers with provenance
  - name: climate
    description: ENSO (ONI and RONI) historical and current climate series
  - name: scenarios
    description: Controlled-environment crop growth scenario simulation with uncertainty
  - name: search
    description: Typo-tolerant trigram search across crops, places, and farms

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness probe
      responses:
        "200":
          description: Dependencies are reachable
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"

  /v1/auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new farmer or agronomist account
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account registered and access token issued
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated and access token issued
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      tags: [auth]
      summary: Rotate refresh token cookie and issue a new short-lived access token
      responses:
        "200":
          description: Access token refreshed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"

  /v1/auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Revoke current refresh token family and clear session cookie
      responses:
        "204":
          description: Logged out
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"

  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user profile
      responses:
        "200":
          description: Current user profile
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"

  /v1/farms:
    get:
      operationId: listFarms
      tags: [farms]
      summary: List farms owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of farms
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmListResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"
    post:
      operationId: createFarm
      tags: [farms]
      summary: Create a farm with a reference point or GeoJSON polygon
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmRequest"
      responses:
        "201":
          description: Farm created
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/farms/{id}:
    parameters:
      - $ref: "#/components/parameters/FarmId"
    get:
      operationId: getFarm
      tags: [farms]
      summary: Get a farm by ID
      responses:
        "200":
          description: Farm details
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
    patch:
      operationId: updateFarm
      tags: [farms]
      summary: Update a farm's name, current rotation, or geometry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFarmRequest"
      responses:
        "200":
          description: Updated farm
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
    delete:
      operationId: deleteFarm
      tags: [farms]
      summary: Delete a farm
      responses:
        "204":
          description: Farm deleted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/farms/{id}/uploads:
    parameters:
      - $ref: "#/components/parameters/FarmId"
    get:
      operationId: listFarmUploads
      tags: [farms]
      summary: List uploaded farm history files and validation status
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of uploads for the farm
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmUploadListResponse"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
    post:
      operationId: createFarmUpload
      tags: [farms]
      summary: Upload CSV or GeoJSON farm records with row-level validation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmUploadRequest"
      responses:
        "201":
          description: Upload processed with validation summary and row-level errors
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmUpload"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/farms/{id}/priorities:
    parameters:
      - $ref: "#/components/parameters/FarmId"
    get:
      operationId: getFarmPriorities
      tags: [farms]
      summary: Get farmer priorities and agronomic constraints for a farm
      responses:
        "200":
          description: Priorities and constraints for the farm
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmPriorities"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
    put:
      operationId: updateFarmPriorities
      tags: [farms]
      summary: Save farmer priorities and agronomic constraints for a farm
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmPrioritiesUpdate"
      responses:
        "200":
          description: Saved priorities and constraints
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmPriorities"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/farms/{id}/insights:
    parameters:
      - $ref: "#/components/parameters/FarmId"
    get:
      operationId: getFarmInsights
      tags: [farms]
      summary: Get bare-field periods and climate-vulnerable seasons for a farm
      responses:
        "200":
          description: Bare-field periods, vulnerable seasons, provenance, and disclaimer
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmInsights"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/layers:
    get:
      operationId: listLayers
      tags: [layers]
      summary: List available map layers with metadata, legend, and source attribution
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of map layers
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerListResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/climate/enso:
    get:
      operationId: getEnsoSeries
      tags: [climate]
      summary: Get monthly NOAA CPC ONI and RONI values and ENSO phase classification
      parameters:
        - name: start_month
          in: query
          required: false
          description: Start month in YYYY-MM format
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
        - name: end_month
          in: query
          required: false
          description: End month in YYYY-MM format
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: ENSO monthly series with provenance
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsoSeriesResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/scenarios/simulate:
    post:
      operationId: simulateScenario
      tags: [scenarios]
      summary: Run a crop growth scenario simulation with quantile uncertainty ranges
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioSimulationRequest"
      responses:
        "200":
          description: Baseline and scenario predictions with quantile uncertainty and provenance
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioSimulationResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/farms/{id}/recommendations:
    parameters:
      - $ref: "#/components/parameters/FarmId"
    post:
      operationId: createFarmRecommendations
      tags: [farms]
      summary: Compare at least three crop rotation strategies including the current rotation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRequest"
      responses:
        "200":
          description: Rotation comparison with why, evidence, benefits, gaps, risks, uncertainty, scores, provenance, and disclaimer
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /v1/search:
    get:
      operationId: searchCatalog
      tags: [search]
      summary: Trigram search across crops, places, and farms
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (minimum 2 characters)
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: type
          in: query
          required: false
          description: Optional entity filter
          schema:
            $ref: "#/components/schemas/SearchEntityType"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Ranked search results (at most 20 items)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Stub:
              $ref: "#/components/headers/XStub"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"

components:
  headers:
    XRequestId:
      description: Request correlation identifier echoed or generated by the server
      schema:
        type: string
    XStub:
      description: Present and set to "true" when the response comes from a contract stub (rule G10)
      schema:
        type: string
        enum: ["true"]

  parameters:
    FarmId:
      name: id
      in: path
      required: true
      description: Unique farm identifier
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from the previous response
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client key to make retryable writes idempotent
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    UnauthorizedProblem:
      description: Authentication is required or failed
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFoundProblem:
      description: The requested resource was not found
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictProblem:
      description: The request conflicts with existing state
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: Request validation failed
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailableProblem:
      description: A required upstream dependency is unavailable
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]

    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            type: string
        msg:
          type: string
        type:
          type: string

    Problem:
      type: object
      description: RFC 7807 Problem Details with a stable machine-readable code
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"

    PaginationMeta:
      type: object
      required: [limit, next_cursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: ["string", "null"]

    DatasetVersionRef:
      type: object
      required: [dataset_id, version, source, date_range, spatial_resolution]
      properties:
        dataset_id:
          type: string
        version:
          type: string
        source:
          type: string
        date_range:
          type: string
        spatial_resolution:
          type: string
        is_preliminary:
          type: boolean
          default: false

    Provenance:
      type: object
      description: Full lineage of model and dataset versions that produced an output
      required: [model_name, model_version, data_versions, input_hash, generated_at]
      properties:
        model_name:
          type: string
        model_version:
          type: string
        data_versions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DatasetVersionRef"
        input_hash:
          type: string
        generated_at:
          type: string
          format: date-time

    QuantileUncertainty:
      type: object
      description: Prediction range from quantile regression (p10 <= p50 <= p90)
      required: [p10, p50, p90, unit, confidence_note]
      properties:
        p10:
          type: number
        p50:
          type: number
        p90:
          type: number
        unit:
          type: string
        confidence_note:
          type: string

    UserRole:
      type: string
      enum: [farmer, agronomist, admin]

    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 72
          description: Minimum 10 characters, maximum 72 UTF-8 bytes (bcrypt limit)
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: "#/components/schemas/UserRole"
          default: farmer

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72

    UserProfile:
      type: object
      required: [id, email, full_name, role, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time

    AuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds (900s = 15 minutes)
        user:
          $ref: "#/components/schemas/UserProfile"

    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    GeoPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number

    Farm:
      type: object
      required:
        - id
        - name
        - department
        - municipality
        - reference_point
        - area_ha
        - elevation_m
        - current_rotation
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        department:
          type: string
        municipality:
          type: string
        reference_point:
          $ref: "#/components/schemas/GeoPoint"
        polygon:
          anyOf:
            - $ref: "#/components/schemas/GeoPolygon"
            - type: "null"
        area_ha:
          type: number
          minimum: 0.01
        elevation_m:
          type: number
        current_rotation:
          type: array
          minItems: 1
          items:
            type: string
        station_reference:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateFarmRequest:
      type: object
      required: [name, department, municipality, reference_point, area_ha, current_rotation]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        department:
          type: string
          minLength: 1
          maxLength: 80
        municipality:
          type: string
          minLength: 1
          maxLength: 80
        reference_point:
          $ref: "#/components/schemas/GeoPoint"
        polygon:
          anyOf:
            - $ref: "#/components/schemas/GeoPolygon"
            - type: "null"
        area_ha:
          type: number
          minimum: 0.01
          maximum: 100000
        elevation_m:
          type: number
          default: 1502
        current_rotation:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1

    UpdateFarmRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        area_ha:
          type: number
          minimum: 0.01
          maximum: 100000
        current_rotation:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
        polygon:
          anyOf:
            - $ref: "#/components/schemas/GeoPolygon"
            - type: "null"

    FarmListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Farm"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    UploadRowError:
      type: object
      required: [row, column, code, message]
      properties:
        row:
          type: integer
          minimum: 1
        column:
          type: string
        code:
          type: string
        message:
          type: string

    FarmUpload:
      type: object
      required:
        - id
        - farm_id
        - filename
        - format
        - status
        - total_rows
        - valid_rows
        - row_errors
        - created_at
      properties:
        id:
          type: string
        farm_id:
          type: string
        filename:
          type: string
        format:
          type: string
          enum: [csv, geojson]
        status:
          type: string
          enum: [validated,validated_with_errors, rejected]
        total_rows:
          type: integer
          minimum: 0
        valid_rows:
          type: integer
          minimum: 0
        row_errors:
          type: array
          items:
            $ref: "#/components/schemas/UploadRowError"
        created_at:
          type: string
          format: date-time

    CreateFarmUploadRequest:
      type: object
      required: [filename, format, content]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        format:
          type: string
          enum: [csv, geojson]
        content:
          type: string
          minLength: 1
          maxLength: 100000
          description: Raw CSV text or GeoJSON payload submitted for validation

    FarmUploadListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FarmUpload"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    PriorityWeights:
      type: object
      required:
        - yield_stability
        - soil_health
        - water_efficiency
        - income_diversification
        - low_input_cost
      properties:
        yield_stability:
          type: number
          minimum: 0
          maximum: 1
        soil_health:
          type: number
          minimum: 0
          maximum: 1
        water_efficiency:
          type: number
          minimum: 0
          maximum: 1
        income_diversification:
          type: number
          minimum: 0
          maximum: 1
        low_input_cost:
          type: number
          minimum: 0
          maximum: 1

    FarmPriorities:
      type: object
      required:
        - farm_id
        - weights
        - irrigation_available
        - max_fallow_days
        - excluded_crops
        - updated_at
      properties:
        farm_id:
          type: string
        weights:
          $ref: "#/components/schemas/PriorityWeights"
        irrigation_available:
          type: boolean
        max_fallow_days:
          type: integer
          minimum: 0
          maximum: 365
        excluded_crops:
          type: array
          items:
            type: string
        notes:
          type: string
        updated_at:
          type: string
          format: date-time

    FarmPrioritiesUpdate:
      type: object
      required: [weights, irrigation_available, max_fallow_days]
      properties:
        weights:
          $ref: "#/components/schemas/PriorityWeights"
        irrigation_available:
          type: boolean
        max_fallow_days:
          type: integer
          minimum: 0
          maximum: 365
        excluded_crops:
          type: array
          items:
            type: string
          default: []
        notes:
          type: string
          maxLength: 500

    BareFieldPeriod:
      type: object
      required: [start_date, end_date, duration_days, mean_ndvi, erosion_exposure, explanation]
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        duration_days:
          type: integer
          minimum: 1
        mean_ndvi:
          type: number
          minimum: -1
          maximum: 1
        erosion_exposure:
          type: string
          enum: [low, moderate, high]
        explanation:
          type: string

    VulnerableSeason:
      type: object
      required: [season_name, months, primary_hazard, enso_sensitivity, recommended_watch]
      properties:
        season_name:
          type: string
        months:
          type: string
        primary_hazard:
          type: string
          enum: [dry_spell_canicula, extreme_rainfall, cold_night_frost, heat_stress]
        enso_sensitivity:
          type: string
        recommended_watch:
          type: string

    FarmInsights:
      type: object
      required:
        - farm_id
        - bare_field_periods
        - vulnerable_seasons
        - provenance
        - disclaimer
      properties:
        farm_id:
          type: string
        bare_field_periods:
          type: array
          items:
            $ref: "#/components/schemas/BareFieldPeriod"
        vulnerable_seasons:
          type: array
          items:
            $ref: "#/components/schemas/VulnerableSeason"
        provenance:
          $ref: "#/components/schemas/Provenance"
        disclaimer:
          type: string

    LayerLegendStop:
      type: object
      required: [value, color, label]
      properties:
        value:
          type: number
        color:
          type: string
        label:
          type: string

    LayerLegend:
      type: object
      required: [unit, palette_name, color_blind_safe, stops]
      properties:
        unit:
          type: string
        palette_name:
          type: string
        color_blind_safe:
          type: boolean
        stops:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/LayerLegendStop"

    LayerSourceBlock:
      type: object
      required:
        - provider
        - dataset_id
        - version
        - spatial_resolution
        - date_range
        - measurement_type
        - limitation_note
      properties:
        provider:
          type: string
        dataset_id:
          type: string
        version:
          type: string
        spatial_resolution:
          type: string
        date_range:
          type: string
        measurement_type:
          type: string
          enum: [satellite_derived, ground_station, reanalysis_model, soil_prediction]
        limitation_note:
          type: string

    MapLayer:
      type: object
      required: [id, name, category, description, tile_url_template, legend, source]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [climate, soil, vegetation, terrain, water_stress]
        description:
          type: string
        tile_url_template:
          type: string
        legend:
          $ref: "#/components/schemas/LayerLegend"
        source:
          $ref: "#/components/schemas/LayerSourceBlock"

    LayerListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MapLayer"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    EnsoPhase:
      type: string
      enum: [el_nino, la_nina, neutral]

    EnsoMonthPoint:
      type: object
      required: [month, oni_c, roni_c, phase, rainfall_anomaly_note]
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        oni_c:
          type: number
        roni_c:
          type: number
        phase:
          $ref: "#/components/schemas/EnsoPhase"
        rainfall_anomaly_note:
          type: string

    EnsoSeriesResponse:
      type: object
      required: [threshold_c, items, provenance, disclaimer]
      properties:
        threshold_c:
          type: number
          description: Absolute anomaly threshold in degrees C (0.5 C)
        items:
          type: array
          items:
            $ref: "#/components/schemas/EnsoMonthPoint"
        provenance:
          $ref: "#/components/schemas/Provenance"
        disclaimer:
          type: string

    ScenarioSimulationRequest:
      type: object
      required: [farm_id, crop_id, rainfall_change_pct, temperature_change_c, enso_phase]
      properties:
        farm_id:
          type: string
          minLength: 1
        crop_id:
          type: string
          minLength: 1
        season_start:
          type: string
          format: date
          default: "2025-05-01"
        season_end:
          type: string
          format: date
          default: "2025-10-31"
        rainfall_change_pct:
          type: number
          minimum: -60
          maximum: 60
          description: Simulated rainfall delta in percent relative to local climatology
        temperature_change_c:
          type: number
          minimum: -4
          maximum: 6
          description: Simulated mean temperature delta in degrees C
        enso_phase:
          $ref: "#/components/schemas/EnsoPhase"

    FeatureAttribution:
      type: object
      required: [feature, shap_value, direction, explanation]
      properties:
        feature:
          type: string
        shap_value:
          type: number
        direction:
          type: string
          enum: [positive, negative, neutral]
        explanation:
          type: string

    ScenarioTimelineStep:
      type: object
      required: [period, baseline_p50, scenario_p10, scenario_p50, scenario_p90, water_balance_mm]
      properties:
        period:
          type: string
        baseline_p50:
          type: number
        scenario_p10:
          type: number
        scenario_p50:
          type: number
        scenario_p90:
          type: number
        water_balance_mm:
          type: number

    ScenarioSimulationResponse:
      type: object
      required:
        - farm_id
        - crop_id
        - metric_name
        - baseline
        - scenario
        - out_of_training_range
        - range_warning
        - top_attributions
        - timeline
        - provenance
        - disclaimer
      properties:
        farm_id:
          type: string
        crop_id:
          type: string
        metric_name:
          type: string
        baseline:
          $ref: "#/components/schemas/QuantileUncertainty"
        scenario:
          $ref: "#/components/schemas/QuantileUncertainty"
        out_of_training_range:
          type: boolean
        range_warning:
          type: ["string", "null"]
        top_attributions:
          type: array
          items:
            $ref: "#/components/schemas/FeatureAttribution"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioTimelineStep"
        provenance:
          $ref: "#/components/schemas/Provenance"
        disclaimer:
          type: string

    RecommendationRequest:
      type: object
      properties:
        enso_phase:
          $ref: "#/components/schemas/EnsoPhase"
          default: la_nina
        rainfall_change_pct:
          type: number
          minimum: -60
          maximum: 60
          default: 0
        temperature_change_c:
          type: number
          minimum: -4
          maximum: 6
          default: 0

    StrategyScores:
      type: object
      required:
        - overall
        - yield_stability
        - soil_health
        - water_efficiency
        - income_diversification
        - low_input_cost
      properties:
        overall:
          type: number
          minimum: 0
          maximum: 100
        yield_stability:
          type: number
          minimum: 0
          maximum: 100
        soil_health:
          type: number
          minimum: 0
          maximum: 100
        water_efficiency:
          type: number
          minimum: 0
          maximum: 100
        income_diversification:
          type: number
          minimum: 0
          maximum: 100
        low_input_cost:
          type: number
          minimum: 0
          maximum: 100

    RotationStrategy:
      type: object
      description: >
        A crop rotation strategy with agronomic justification, evidence, expected
        benefits, explicit data gaps, risks requiring local review, quantile
        uncertainty, and priority score breakdown (rule G10).
      required:
        - id
        - name
        - is_current_rotation
        - sequence
        - why
        - evidence
        - benefits
        - gaps
        - risks
        - needs_local_review
        - uncertainty
        - scores
      properties:
        id:
          type: string
        name:
          type: string
        is_current_rotation:
          type: boolean
        sequence:
          type: array
          minItems: 1
          items:
            type: string
        why:
          type: array
          minItems: 1
          items:
            type: string
        evidence:
          type: array
          minItems: 1
          items:
            type: string
        benefits:
          type: array
          minItems: 1
          items:
            type: string
        gaps:
          type: array
          minItems: 1
          items:
            type: string
        risks:
          type: array
          minItems: 1
          items:
            type: string
        needs_local_review:
          type: boolean
        uncertainty:
          $ref: "#/components/schemas/QuantileUncertainty"
        scores:
          $ref: "#/components/schemas/StrategyScores"

    Recommendation:
      type: object
      description: >
        Decision-support rotation comparison containing at least three strategies
        (including the current rotation), full provenance, and mandatory disclaimer.
      required:
        - id
        - farm_id
        - scenario_summary
        - strategies
        - provenance
        - disclaimer
      properties:
        id:
          type: string
        farm_id:
          type: string
        scenario_summary:
          type: string
        strategies:
          type: array
          minItems: 3
          items:
            $ref: "#/components/schemas/RotationStrategy"
        provenance:
          $ref: "#/components/schemas/Provenance"
        disclaimer:
          type: string

    SearchEntityType:
      type: string
      enum: [crop, place, farm]

    SearchResultItem:
      type: object
      required: [id, type, name, aliases, similarity, summary]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/SearchEntityType"
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        similarity:
          type: number
          minimum: 0
          maximum: 1
        summary:
          type: string

    SearchResponse:
      type: object
      required: [query, items, pagination]
      properties:
        query:
          type: string
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SearchResultItem"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
